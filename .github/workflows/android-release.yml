name: Android Release CI/CD

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    name: Build, Sign & Publish Latest Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compute Auto-Incremented Version (1.x.x)
        id: versioning
        run: |
          RUN_NUM=${{ github.run_number }}
          VERSION_CODE=$((RUN_NUM + 1))
          MINOR=$(( (RUN_NUM) / 100 ))
          PATCH=$(( (RUN_NUM) % 100 ))
          VERSION_NAME="1.${MINOR}.${PATCH}"
          TAG_NAME="v${VERSION_NAME}"

          APP_NAME=$(grep -E 'rootProject\.name\s*=' settings.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d ' ')
          if [ -z "$APP_NAME" ]; then
            APP_NAME="Blackhole"
          fi

          OUTPUT_APK="${APP_NAME}.v${VERSION_NAME}.apk"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUTPUT_APK}" >> "$GITHUB_OUTPUT"
          echo "Auto-versioning build -> versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}, asset=${OUTPUT_APK}"

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Build & Sign Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_VERSION_CODE: ${{ steps.versioning.outputs.version_code }}
          BUILD_VERSION_NAME: ${{ steps.versioning.outputs.version_name }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename Output APK
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$RELEASE_APK" "${{ steps.versioning.outputs.apk_path }}"

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: "${{ steps.versioning.outputs.tag_name }}"
          body: |
            Automated signed release build for **${{ steps.versioning.outputs.apk_path }}**.
            - Version Name: `${{ steps.versioning.outputs.version_name }}`
            - Version Code: `${{ steps.versioning.outputs.version_code }}`
            - Commit: `${{ github.sha }}`
          files: ${{ steps.versioning.outputs.apk_path }}
          draft: false
          prerelease: false

      - name: Delete Old Releases & Tags (Keep Latest Only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ steps.versioning.outputs.tag_name }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old_tag; do
            if [ -n "$old_tag" ] && [ "$old_tag" != "$LATEST_TAG" ]; then
              echo "Deleting old release and tag: $old_tag"
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done

          git fetch --tags --force
          git tag -l 'v*' | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "$LATEST_TAG" ]; then
              echo "Removing leftover tag: $tag"
              git push origin ":refs/tags/$tag" || true
            fi
          done

      - name: Clean Up Old GitHub Actions History
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }} and .status == \"completed\") | .id" | \
            while read -r run_id; do
              if [ -n "$run_id" ]; then
                echo "Deleting old workflow run: $run_id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" || true
              fi
            done

      - name: Cleanup Decoded Keystore
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks"
